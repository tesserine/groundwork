# Groundwork Methodology Manifest
#
# runa reads this file to understand the groundwork methodology.
# Topology emerges from the graph of requires/produces relationships.

name = "groundwork"
version = "0.3.0-rc.1"
# --- Artifact Types ---

[[artifact_types]]
name = "request"

[[artifact_types]]
name = "requirements"

[[artifact_types]]
name = "work-unit"

[[artifact_types]]
name = "behavior-contract"

[[artifact_types]]
name = "implementation-plan"

[[artifact_types]]
name = "test-evidence"

[[artifact_types]]
name = "completion-evidence"

[[artifact_types]]
name = "change-proposal"

[[artifact_types]]
name = "change-approved"

[[artifact_types]]
name = "change-needs-revision"

[[artifact_types]]
name = "completion-record"

[[artifact_types]]
name = "research-record"

# --- Outcome Types ---
#
# Outcome types are artifact types whose produced type is the disposition used
# for cross-protocol routing.

[[outcome_types]]
name = "change-approved"

[[outcome_types]]
name = "change-needs-revision"

# --- Mechanics ---
#
# Referenceable mechanic handles for C-2 workflow contracts. Forge-domain
# operation handles name connector-contributed MCP tools from the vendored
# forge capability; provider selection and provider identity live in the
# selected connector, not in methodology mechanics.

[[mechanics]]
name = "read-artifact"

[[mechanics]]
name = "inspect-change-proposals"

[[mechanics]]
name = "deliver-change-proposal"

[[mechanics]]
name = "revise"

[[mechanics]]
name = "review"

[[mechanics]]
name = "apply-approved-change"

[[mechanics]]
name = "reflect-disposition"

[[mechanics]]
name = "close-out"

[[mechanics]]
name = "create-ticket"

[[mechanics]]
name = "read-ticket"

[[mechanics]]
name = "claim-work-unit"

[[mechanics]]
name = "record-progress"

[[mechanics]]
name = "inspect-worktree"

[[mechanics]]
name = "run-test"

# --- Protocols ---
#
# Planning phase (unscoped): survey → decompose
# Scoped pipeline (per work unit):
#   take → plan → implement → verify → submit → review → land
#
# The behavior contract is the spine: take produces it at entry, and every
# judgment station (plan, implement, verify, submit, review) requires it.
# land, the mechanical applier, accepts it for the completion record.

[[protocols]]
name = "survey"
requires = ["request"]
accepts = ["research-record"]
produces = ["requirements"]
may_produce = ["research-record"]
trigger = { type = "on_artifact", name = "request" }

[[protocols]]
name = "decompose"
requires = ["requirements"]
accepts = ["research-record"]
produces = ["work-unit"]
may_produce = ["research-record"]
trigger = { type = "on_artifact", name = "requirements" }

[[protocols]]
name = "take"
scoped = true
requires = ["work-unit"]
accepts = ["research-record"]
produces = ["behavior-contract"]
may_produce = ["research-record"]
trigger = { type = "on_artifact", name = "work-unit" }

[[protocols]]
name = "plan"
scoped = true
requires = ["behavior-contract"]
accepts = ["work-unit", "research-record"]
produces = ["implementation-plan"]
may_produce = ["research-record"]
trigger = { type = "on_artifact", name = "behavior-contract" }

[[protocols]]
name = "implement"
scoped = true
requires = ["behavior-contract", "implementation-plan"]
accepts = []
produces = ["test-evidence"]
may_produce = []
trigger = { type = "on_artifact", name = "implementation-plan" }

[[protocols]]
name = "verify"
scoped = true
requires = ["behavior-contract", "test-evidence", "work-unit"]
accepts = ["implementation-plan"]
produces = ["completion-evidence"]
may_produce = []
trigger = { type = "on_artifact", name = "test-evidence" }

[[protocols]]
name = "submit"
scoped = true
requires = ["completion-evidence", "behavior-contract"]
accepts = ["change-proposal", "change-needs-revision"]
produces = ["change-proposal"]
may_produce = []
trigger = { type = "any_of", conditions = [
  { type = "on_artifact", name = "completion-evidence" },
  { type = "on_artifact", name = "change-needs-revision" },
] }

[[protocols]]
name = "review"
scoped = true
requires = ["change-proposal", "behavior-contract"]
accepts = ["work-unit", "implementation-plan", "completion-evidence"]
produces = []
may_produce = []
trigger = { type = "on_change", name = "change-proposal" }

[[protocols.required_output_choices]]
name = "review-disposition"
members = ["change-approved", "change-needs-revision"]

[[protocols]]
name = "land"
scoped = true
requires = ["change-approved", "change-proposal"]
accepts = ["behavior-contract", "completion-evidence", "work-unit"]
produces = ["completion-record"]
may_produce = []
trigger = { type = "on_artifact", name = "change-approved" }
