# Groundwork Methodology Manifest
#
# runa reads this file to understand the groundwork methodology.
# Topology emerges from the graph of requires/produces relationships.

name = "groundwork"
version = "0.3.0-rc.1"
# --- Artifact Types ---

[[artifact_types]]
name = "intent"

[[artifact_types]]
name = "requirements"

[[artifact_types]]
name = "work-unit"

[[artifact_types]]
name = "contract"

[[artifact_types]]
name = "implementation-plan"

[[artifact_types]]
name = "test-evidence"

[[artifact_types]]
name = "completion-evidence"

[[artifact_types]]
name = "change-proposal"

[[artifact_types]]
name = "change-approved"

[[artifact_types]]
name = "change-needs-revision"

[[artifact_types]]
name = "completion-record"

[[artifact_types]]
name = "research-record"

# --- Outcome Types ---
#
# Outcome types are artifact types whose produced type is the disposition used
# for cross-protocol routing.

[[outcome_types]]
name = "change-approved"

[[outcome_types]]
name = "change-needs-revision"

# --- Mechanics ---
#
# Referenceable non-forge mechanic handles for C-2 workflow contracts. Forge
# operation handles are supplied by the vendored connector capability schema.

[[mechanics]]
name = "read-artifact"

[[mechanics]]
name = "inspect-change-proposals"

[[mechanics]]
name = "revise"

[[mechanics]]
name = "review"

[[mechanics]]
name = "inspect-worktree"

[[mechanics]]
name = "run-test"

# --- Protocols ---
#
# Planning phase (unscoped): survey → decompose
# Scoped pipeline (per work unit):
#   define → plan → implement → verify → submit → review → land
#
# `decompose` is also the acquisition surface: it is the sole unscoped
# producer of `work-unit`. Ordinary planning still reaches it through the
# `requirements` trigger, while cold-start work-unit entry substitutes that
# trigger so acquisition can materialize the work-unit before requirements
# exist.
#
# The contract is the spine: define produces it at entry, and every
# judgment station (plan, implement, verify, submit, review) requires it.
# land, the mechanical applier, accepts it for the completion record.

[[protocols]]
name = "survey"
requires = ["intent"]
accepts = ["research-record"]
produces = ["requirements"]
may_produce = ["research-record"]
trigger = { type = "on_artifact", name = "intent" }

[[protocols]]
name = "decompose"
accepts = ["requirements", "research-record"]
produces = ["work-unit"]
may_produce = ["research-record"]
trigger = { type = "on_artifact", name = "requirements" }

[[protocols]]
name = "define"
scoped = true
requires = ["work-unit"]
accepts = ["research-record"]
produces = ["contract"]
may_produce = ["research-record"]
trigger = { type = "on_artifact", name = "work-unit" }

[[protocols]]
name = "plan"
scoped = true
requires = ["contract"]
accepts = ["work-unit", "research-record"]
produces = ["implementation-plan"]
may_produce = ["research-record"]
trigger = { type = "on_artifact", name = "contract" }

[[protocols]]
name = "implement"
scoped = true
requires = ["contract", "implementation-plan"]
accepts = []
produces = ["test-evidence"]
may_produce = []
trigger = { type = "on_artifact", name = "implementation-plan" }

[[protocols]]
name = "verify"
scoped = true
requires = ["contract", "test-evidence", "work-unit"]
accepts = ["implementation-plan"]
produces = ["completion-evidence"]
may_produce = []
trigger = { type = "on_artifact", name = "test-evidence" }

[[protocols]]
name = "submit"
scoped = true
requires = ["completion-evidence", "contract"]
accepts = ["change-proposal", "change-needs-revision"]
produces = ["change-proposal"]
may_produce = []
trigger = { type = "any_of", conditions = [
  { type = "on_artifact", name = "completion-evidence" },
  { type = "on_artifact", name = "change-needs-revision" },
] }

[[protocols]]
name = "review"
scoped = true
requires = ["change-proposal", "contract"]
accepts = ["work-unit", "implementation-plan", "completion-evidence"]
produces = []
may_produce = []
trigger = { type = "on_change", name = "change-proposal" }

[[protocols.required_output_choices]]
name = "review-disposition"
members = ["change-approved", "change-needs-revision"]

[[protocols]]
name = "land"
scoped = true
requires = ["change-approved", "change-proposal"]
accepts = ["contract", "completion-evidence", "work-unit"]
produces = ["completion-record"]
may_produce = []
trigger = { type = "on_artifact", name = "change-approved" }
