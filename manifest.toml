# Groundwork Methodology Manifest
#
# runa reads this file to understand the groundwork methodology.
# Topology emerges from the graph of requires/produces relationships.

name = "groundwork"
version = "0.2.0"
# --- Artifact Types ---

[[artifact_types]]
name = "request"

[[artifact_types]]
name = "requirements"

[[artifact_types]]
name = "work-unit"

[[artifact_types]]
name = "claim"

[[artifact_types]]
name = "behavior-contract"

[[artifact_types]]
name = "implementation-plan"

[[artifact_types]]
name = "test-evidence"

[[artifact_types]]
name = "completion-evidence"

[[artifact_types]]
name = "documentation-record"

[[artifact_types]]
name = "change-proposal"

[[artifact_types]]
name = "change-approved"

[[artifact_types]]
name = "change-needs-revision"

[[artifact_types]]
name = "patch"

[[artifact_types]]
name = "completion-record"

[[artifact_types]]
name = "research-record"

# --- Outcome Types ---
#
# Outcome types are artifact types whose produced type is the disposition used
# for cross-protocol routing.

[[outcome_types]]
name = "change-approved"

[[outcome_types]]
name = "change-needs-revision"

# --- Forge Tags ---
#
# Canonical forge tags used by forge-tagged artifact handles and mechanics.

[[forge_tags]]
name = "github"

[[forge_tags]]
name = "sourcehut"

# --- Mechanics ---
#
# Referenceable mechanic handles for C-2 workflow contracts. Full C-3 mechanic
# definitions may refine these handles as the mechanic library is authored.

[[mechanics]]
name = "read-artifact"

[[mechanics]]
name = "inspect-change-proposals"

[[mechanics]]
name = "deliver-change-proposal"

[[mechanics]]
name = "revise"

[[mechanics]]
name = "review"

[[mechanics]]
name = "inspect-worktree"

[[mechanics]]
name = "run-test"

# --- Protocols ---
#
# Planning phase: survey → decompose
# Execution phase: take → specify → plan → implement → verify
#                  → document → submit → review → land

[[protocols]]
name = "survey"
requires = ["request"]
accepts = ["research-record"]
produces = ["requirements"]
may_produce = ["research-record"]
trigger = { type = "on_artifact", name = "request" }

[[protocols]]
name = "decompose"
requires = ["requirements"]
accepts = ["research-record"]
produces = ["work-unit"]
may_produce = ["research-record"]
trigger = { type = "on_artifact", name = "requirements" }

[[protocols]]
name = "take"
scoped = true
requires = ["work-unit"]
accepts = []
produces = ["claim"]
may_produce = []
trigger = { type = "on_artifact", name = "work-unit" }

[[protocols]]
name = "specify"
scoped = true
requires = ["claim", "work-unit"]
accepts = ["research-record"]
produces = ["behavior-contract"]
may_produce = ["research-record"]
trigger = { type = "on_artifact", name = "claim" }

[[protocols]]
name = "plan"
scoped = true
requires = ["behavior-contract"]
accepts = ["research-record"]
produces = ["implementation-plan"]
may_produce = ["research-record"]
trigger = { type = "on_artifact", name = "behavior-contract" }

[[protocols]]
name = "implement"
scoped = true
requires = ["behavior-contract", "implementation-plan"]
accepts = []
produces = ["test-evidence"]
may_produce = []
trigger = { type = "on_artifact", name = "implementation-plan" }

[[protocols]]
name = "verify"
scoped = true
requires = ["behavior-contract", "test-evidence", "work-unit"]
accepts = []
produces = ["completion-evidence"]
may_produce = []
trigger = { type = "on_artifact", name = "test-evidence" }

[[protocols]]
name = "document"
scoped = true
requires = ["completion-evidence"]
accepts = ["behavior-contract", "implementation-plan"]
produces = ["documentation-record"]
may_produce = []
trigger = { type = "on_artifact", name = "completion-evidence" }

[[protocols]]
name = "submit"
scoped = true
requires = ["completion-evidence", "documentation-record"]
accepts = ["change-proposal", "change-needs-revision"]
produces = ["change-proposal"]
may_produce = []
trigger = { type = "on_artifact", name = "documentation-record" }

[[protocols]]
name = "review"
scoped = true
requires = ["change-proposal"]
accepts = []
produces = []
may_produce = []
trigger = { type = "on_change", name = "change-proposal" }

[[protocols.required_output_choices]]
name = "review-disposition"
members = ["change-approved", "change-needs-revision"]

[[protocols]]
name = "land"
scoped = true
requires = ["patch"]
accepts = ["completion-evidence", "behavior-contract", "documentation-record", "work-unit"]
produces = ["completion-record"]
may_produce = []
trigger = { type = "on_artifact", name = "patch" }
