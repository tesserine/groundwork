name: Release Metadata

on:
  push:
    branches: [main]
    paths:
      - "CHANGELOG.md"
      - "RELEASING.md"
      - "manifest.toml"
      - "requirements-dev.txt"
      - "schemas/**"
      - "tooling/**"
      - "protocols/**"
      - "skills/**"
      - "scripts/release-check"
      - "scripts/release-cut"
      - "scripts/release_lib.py"
      - "scripts/groundwork-mechanic"
      - ".github/workflows/conformance.yml"
      - ".github/workflows/release.yml"
      - ".github/workflows/release-metadata.yml"
  pull_request:
    branches: [main]
    paths:
      - "CHANGELOG.md"
      - "RELEASING.md"
      - "manifest.toml"
      - "requirements-dev.txt"
      - "schemas/**"
      - "tooling/**"
      - "protocols/**"
      - "skills/**"
      - "scripts/release-check"
      - "scripts/release-cut"
      - "scripts/release_lib.py"
      - "scripts/groundwork-mechanic"
      - ".github/workflows/conformance.yml"
      - ".github/workflows/release.yml"
      - ".github/workflows/release-metadata.yml"

permissions:
  contents: read

jobs:
  metadata:
    name: Release metadata
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check release metadata
        run: ./scripts/release-check metadata
