name: Conformance

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  conformance:
    name: Tests and conformance
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dev dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m unittest discover -s tests

      - name: Run methodology conformance
        run: python -m tooling.conformance
