name = "deliver-change-proposal"
purpose = "Deliver a SourceHut change proposal by advancing the persistent feature branch and creating an immutable per-version proposal ref, with no lists.sr.ht delivery."
forge_tag = "sourcehut"
default_invocation = '''commit_resolved=$(git rev-parse "${commit}^{commit}") && existing_commit=$(git ls-remote "$ssh_remote" "$proposal_ref" | cut -f1) && if test -n "$existing_commit" && test "$existing_commit" != "$commit_resolved"; then printf "%s\n" "SourceHut proposal ref $proposal_ref already resolves to $existing_commit, expected absent or $commit_resolved" >&2; exit 1; fi && git push "$ssh_remote" "${commit}:refs/heads/${branch}" && if test -n "$existing_commit"; then printf "%s\n" "$proposal_ref"; exit 0; fi && git push --force-with-lease="$proposal_ref:" "$ssh_remote" "${commit}:${proposal_ref}" && printf "%s\n" "$proposal_ref"'''
examples = [
  '''commit_resolved=$(git rev-parse "7f5a3ce0b626f15e445f4d9fb80663a9a10f4db0^{commit}") && existing_commit=$(git ls-remote git@git.sr.ht:~tesserine/groundwork refs/proposals/issue-316/2 | cut -f1) && if test -n "$existing_commit" && test "$existing_commit" != "$commit_resolved"; then printf "%s\n" "SourceHut proposal ref refs/proposals/issue-316/2 already resolves to $existing_commit, expected absent or $commit_resolved" >&2; exit 1; fi && git push git@git.sr.ht:~tesserine/groundwork 7f5a3ce0b626f15e445f4d9fb80663a9a10f4db0:refs/heads/issue-316/feat-architecture-step-1-change-proposal && if test -n "$existing_commit"; then printf "%s\n" refs/proposals/issue-316/2; exit 0; fi && git push --force-with-lease=refs/proposals/issue-316/2: git@git.sr.ht:~tesserine/groundwork 7f5a3ce0b626f15e445f4d9fb80663a9a10f4db0:refs/proposals/issue-316/2 && printf "%s\n" refs/proposals/issue-316/2''',
]

[[parameters]]
name = "branch"
purpose = "Persistent feature branch carrying the proposed change."
required = true

[[parameters]]
name = "commit"
purpose = "Proposal commit pushed to the feature branch and immutable proposal ref."
required = true

[[parameters]]
name = "ssh_remote"
purpose = "SourceHut Git SSH remote receiving the feature branch and immutable proposal ref."
required = true
deployment_value = "ssh_remote"

[[parameters]]
name = "proposal_ref"
purpose = "Full immutable SourceHut proposal ref recorded in change-proposal.handle.proposal_ref."
required = true

[outcome]
description = "The SourceHut proposal commit is reachable at refs/heads/{branch} from change-proposal.branch for revision work and at immutable change-proposal.handle.proposal_ref for this review-round version."
artifact_type = "change-proposal"
