name = "deliver-change-proposal"
purpose = "Deliver a SourceHut change proposal by advancing the persistent feature branch and creating an immutable per-version proposal ref, with no lists.sr.ht delivery."
forge_tag = "sourcehut"
default_invocation = '''case "$proposal_ref" in refs/proposals/*) : ;; *) printf "%s\n" "SourceHut proposal ref $proposal_ref is outside refs/proposals/" >&2; exit 1 ;; esac && git check-ref-format "$proposal_ref" && branch_ref="refs/heads/${branch}" && git check-ref-format "$branch_ref" && commit_resolved=$(git rev-parse --verify --quiet --end-of-options "${commit}^{commit}") && existing_commit=$(git ls-remote "$ssh_remote" "$proposal_ref" | awk -v ref="$proposal_ref" '$2 == ref { print $1; exit }') && if test -n "$existing_commit" && test "$existing_commit" != "$commit_resolved"; then printf "%s\n" "SourceHut proposal ref $proposal_ref already resolves to $existing_commit, expected absent or $commit_resolved" >&2; exit 1; fi && branch_commit=$(git ls-remote "$ssh_remote" "$branch_ref" | awk -v ref="$branch_ref" '$2 == ref { print $1; exit }') && if test -n "$branch_commit"; then git fetch "$ssh_remote" "$branch_ref" && branch_resolved=$(git rev-parse FETCH_HEAD^{commit}) && if git merge-base --is-ancestor "$commit_resolved" "$branch_resolved"; then :; else git push --force-with-lease="$branch_ref:$branch_commit" "$ssh_remote" "$commit_resolved:$branch_ref"; fi; else git push --force-with-lease="$branch_ref:" "$ssh_remote" "$commit_resolved:$branch_ref"; fi && if test -z "$existing_commit"; then proposal_tail=${proposal_ref#refs/proposals/} && proposal_source_prefix="refs/groundwork/deliver-change-proposal/$$" && proposal_source_ref="$proposal_source_prefix/$proposal_tail" && trap 'git update-ref -d "$proposal_source_ref" >/dev/null 2>&1 || :' EXIT && git update-ref "$proposal_source_ref" "$commit_resolved" && git push --force-with-lease="$proposal_ref:" "$ssh_remote" "$proposal_source_prefix/*:refs/proposals/*" && git update-ref -d "$proposal_source_ref" && trap - EXIT; fi && pinned_commit=$(git ls-remote "$ssh_remote" "$proposal_ref" | awk -v ref="$proposal_ref" '$2 == ref { print $1; exit }') && if test "$pinned_commit" != "$commit_resolved"; then printf "%s\n" "SourceHut proposal ref $proposal_ref resolves to ${pinned_commit:-<absent>}, expected $commit_resolved" >&2; exit 1; fi && printf "%s\n" "$proposal_ref"'''
examples = [
  '''case refs/proposals/issue-316/2 in refs/proposals/*) : ;; *) printf "%s\n" "SourceHut proposal ref refs/proposals/issue-316/2 is outside refs/proposals/" >&2; exit 1 ;; esac && git check-ref-format refs/proposals/issue-316/2 && branch_ref="refs/heads/issue-316/feat-architecture-step-1-change-proposal" && git check-ref-format "$branch_ref" && commit_resolved=$(git rev-parse --verify --quiet --end-of-options "7f5a3ce0b626f15e445f4d9fb80663a9a10f4db0^{commit}") && existing_commit=$(git ls-remote git@git.sr.ht:~tesserine/groundwork refs/proposals/issue-316/2 | awk -v ref="refs/proposals/issue-316/2" '$2 == ref { print $1; exit }') && if test -n "$existing_commit" && test "$existing_commit" != "$commit_resolved"; then printf "%s\n" "SourceHut proposal ref refs/proposals/issue-316/2 already resolves to $existing_commit, expected absent or $commit_resolved" >&2; exit 1; fi && branch_commit=$(git ls-remote git@git.sr.ht:~tesserine/groundwork "$branch_ref" | awk -v ref="$branch_ref" '$2 == ref { print $1; exit }') && if test -n "$branch_commit"; then git fetch git@git.sr.ht:~tesserine/groundwork "$branch_ref" && branch_resolved=$(git rev-parse FETCH_HEAD^{commit}) && if git merge-base --is-ancestor "$commit_resolved" "$branch_resolved"; then :; else git push --force-with-lease="$branch_ref:$branch_commit" git@git.sr.ht:~tesserine/groundwork "$commit_resolved:$branch_ref"; fi; else git push --force-with-lease="$branch_ref:" git@git.sr.ht:~tesserine/groundwork "$commit_resolved:$branch_ref"; fi && if test -z "$existing_commit"; then proposal_tail=issue-316/2 && proposal_source_prefix="refs/groundwork/deliver-change-proposal/$$" && proposal_source_ref="$proposal_source_prefix/$proposal_tail" && trap 'git update-ref -d "$proposal_source_ref" >/dev/null 2>&1 || :' EXIT && git update-ref "$proposal_source_ref" "$commit_resolved" && git push --force-with-lease=refs/proposals/issue-316/2: git@git.sr.ht:~tesserine/groundwork "$proposal_source_prefix/*:refs/proposals/*" && git update-ref -d "$proposal_source_ref" && trap - EXIT; fi && pinned_commit=$(git ls-remote git@git.sr.ht:~tesserine/groundwork refs/proposals/issue-316/2 | awk -v ref="refs/proposals/issue-316/2" '$2 == ref { print $1; exit }') && if test "$pinned_commit" != "$commit_resolved"; then printf "%s\n" "SourceHut proposal ref refs/proposals/issue-316/2 resolves to ${pinned_commit:-<absent>}, expected $commit_resolved" >&2; exit 1; fi && printf "%s\n" refs/proposals/issue-316/2''',
]

[[parameters]]
name = "branch"
purpose = "Persistent feature branch carrying the proposed change."
required = true

[[parameters]]
name = "commit"
purpose = "Proposal commit pushed to the feature branch and immutable proposal ref."
required = true

[[parameters]]
name = "ssh_remote"
purpose = "SourceHut Git SSH remote receiving the feature branch and immutable proposal ref."
required = true
deployment_value = "ssh_remote"

[[parameters]]
name = "proposal_ref"
purpose = "Full immutable SourceHut proposal ref recorded in change-proposal.handle.proposal_ref."
required = true

[outcome]
description = "The SourceHut proposal commit is reachable at refs/heads/{branch} from change-proposal.branch for revision work and at immutable change-proposal.handle.proposal_ref for this review-round version."
artifact_type = "change-proposal"
