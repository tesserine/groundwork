name = "apply-approved-change"
purpose = "Apply the SourceHut proposal ref resolved by work_unit and against_version, verify it resolves to the approved commit, and push that commit to the explicit target ref over SSH."
forge_tag = "sourcehut"
default_invocation = ''': "$work_unit" "$against_version" "$base" && git check-ref-format "$proposal_ref" && git check-ref-format "$target_ref" && git fetch "$ssh_remote" "$proposal_ref" && fetched_commit=$(git rev-parse FETCH_HEAD^{commit}) && approved_resolved=$(git rev-parse --verify --quiet --end-of-options "${approved_commit}^{commit}") && if test "$fetched_commit" != "$approved_resolved"; then printf "%s\n" "SourceHut proposal ref resolved to $fetched_commit, expected $approved_resolved" >&2; exit 1; fi && git push "$ssh_remote" "$approved_resolved:$target_ref" && test "$(git ls-remote "$ssh_remote" "$target_ref" | awk -v ref="$target_ref" '$2 == ref { print $1; exit }')" = "$approved_resolved"'''
examples = [
  ''': "$work_unit" "$against_version" "$base" && git check-ref-format "$proposal_ref" && git check-ref-format "$target_ref" && git fetch "$ssh_remote" "$proposal_ref" && fetched_commit=$(git rev-parse FETCH_HEAD^{commit}) && approved_resolved=$(git rev-parse --verify --quiet --end-of-options "${approved_commit}^{commit}") && if test "$fetched_commit" != "$approved_resolved"; then printf "%s\n" "SourceHut proposal ref resolved to $fetched_commit, expected $approved_resolved" >&2; exit 1; fi && git push "$ssh_remote" "$approved_resolved:$target_ref" && test "$(git ls-remote "$ssh_remote" "$target_ref" | awk -v ref="$target_ref" '$2 == ref { print $1; exit }')" = "$approved_resolved"''',
]

[[parameters]]
name = "work_unit"
purpose = "Work-unit identity used with against_version to resolve the approved change-proposal."
required = true

[[parameters]]
name = "against_version"
purpose = "Approved proposal version from change-approved.against_version."
required = true

[[parameters]]
name = "proposal_ref"
purpose = "Full immutable SourceHut proposal ref resolved from the approved change-proposal handle."
required = true

[[parameters]]
name = "approved_commit"
purpose = "Approved proposal commit whose identity must match the fetched proposal ref."
required = true

[[parameters]]
name = "ssh_remote"
purpose = "SourceHut Git SSH remote used to fetch the proposal ref and push the applied target ref."
required = true
deployment_value = "ssh_remote"

[[parameters]]
name = "base"
purpose = "Base revision metadata recorded by the approved proposal; not used to derive the pushed ref."
required = true

[[parameters]]
name = "target_ref"
purpose = "Full branch ref advanced by the approved proposal."
required = true

[outcome]
description = "The approved SourceHut proposal ref is fetched, FETCH_HEAD matches the approved proposal commit, and target_ref is advanced to that exact commit."
