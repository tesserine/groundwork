name = "close-out"
purpose = "Record SourceHut work-unit completion context and resolve the tracker ticket."
forge_tag = "sourcehut"
default_invocation = '''comment_response=$(mktemp) && status_response=$(mktemp) && trap 'rm -f "$comment_response" "$status_response"' EXIT && curl --fail --silent --show-error --header "Authorization: Bearer {{token}}" --header 'Content-Type: application/json' --data @{{comment_payload_file}} {{todo_query_url}} > "$comment_response" && python3 -c 'import json, sys; expected=sys.argv[2]; payload=json.load(open(sys.argv[1], encoding="utf-8")); data=payload.get("data"); value=data.get(expected) if isinstance(data, dict) else None; sys.exit("SourceHut %s GraphQL response contained errors or omitted data.%s" % (expected, expected)) if "errors" in payload or value is None else None' "$comment_response" submitComment && curl --fail --silent --show-error --header "Authorization: Bearer {{token}}" --header 'Content-Type: application/json' --data @{{status_payload_file}} {{todo_query_url}} > "$status_response" && python3 -c 'import json, sys; expected=sys.argv[2]; payload=json.load(open(sys.argv[1], encoding="utf-8")); data=payload.get("data"); value=data.get(expected) if isinstance(data, dict) else None; sys.exit("SourceHut %s GraphQL response contained errors or omitted data.%s" % (expected, expected)) if "errors" in payload or value is None else None' "$status_response" updateTicketStatus'''
examples = [
  '''comment_response=$(mktemp) && status_response=$(mktemp) && trap 'rm -f "$comment_response" "$status_response"' EXIT && curl --fail --silent --show-error --header "Authorization: Bearer $WEFORGE_OPERATOR_PAT" --header 'Content-Type: application/json' --data @/tmp/sourcehut-completion-comment.json https://todo.sr.ht/query > "$comment_response" && python3 -c 'import json, sys; expected=sys.argv[2]; payload=json.load(open(sys.argv[1], encoding="utf-8")); data=payload.get("data"); value=data.get(expected) if isinstance(data, dict) else None; sys.exit("SourceHut %s GraphQL response contained errors or omitted data.%s" % (expected, expected)) if "errors" in payload or value is None else None' "$comment_response" submitComment && curl --fail --silent --show-error --header "Authorization: Bearer $WEFORGE_OPERATOR_PAT" --header 'Content-Type: application/json' --data @/tmp/sourcehut-completion-resolved.json https://todo.sr.ht/query > "$status_response" && python3 -c 'import json, sys; expected=sys.argv[2]; payload=json.load(open(sys.argv[1], encoding="utf-8")); data=payload.get("data"); value=data.get(expected) if isinstance(data, dict) else None; sys.exit("SourceHut %s GraphQL response contained errors or omitted data.%s" % (expected, expected)) if "errors" in payload or value is None else None' "$status_response" updateTicketStatus''',
]

[[parameters]]
name = "tracker_id"
purpose = "todo.sr.ht tracker ID containing the work-unit ticket."
required = true

[[parameters]]
name = "ticket_id"
purpose = "todo.sr.ht ticket ID whose completion is recorded."
required = true

[[parameters]]
name = "comment_payload_file"
purpose = "JSON GraphQL payload for submitComment containing completion context."
required = true

[[parameters]]
name = "status_payload_file"
purpose = "JSON GraphQL payload for updateTicketStatus resolving the ticket."
required = true

[[parameters]]
name = "todo_query_url"
purpose = "SourceHut todo GraphQL endpoint used for submitComment and updateTicketStatus."
required = true

[[parameters]]
name = "token"
purpose = "SourceHut API token supplied from WEFORGE_OPERATOR_PAT at command time only; never hardcoded, written, echoed, or logged."
required = true

[outcome]
description = "The SourceHut tracker ticket records completion context and final resolved state."
