name = "close-out"
purpose = "Record work-unit completion context on a GitHub issue and close it as completed."
forge_tag = "github"
default_invocation = 'gh issue comment "$issue_number" --repo "$github_host/$repository" --body-file "$body_file" && gh issue close "$issue_number" --repo "$github_host/$repository" --reason completed'
examples = [
  'gh issue comment "$issue_number" --repo "$github_host/$repository" --body-file "$body_file" && gh issue close "$issue_number" --repo "$github_host/$repository" --reason completed',
]

[[parameters]]
name = "repository"
purpose = "GitHub repository in OWNER/REPO form."
required = true
deployment_value = "repository"

[[parameters]]
name = "github_host"
purpose = "GitHub instance host."
required = true
deployment_value = "github_host"

[[parameters]]
name = "issue_number"
purpose = "GitHub issue number whose work-unit state is closed out."
required = true

[[parameters]]
name = "body_file"
purpose = "Path to a file containing completion context."
required = true

[outcome]
description = "The GitHub issue records completion context and is closed as completed."
