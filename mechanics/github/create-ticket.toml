name = "create-ticket"
purpose = "Create a GitHub issue in the active repository and emit the forge-tagged work-unit handle identity."
forge_tag = "github"
default_invocation = '''response=$(mktemp) && trap 'rm -f "$response"' EXIT && gh api "repos/${repository}/issues" --method POST -f "title=${title}" -F "body=@${body_file}" > "$response" && python3 -c 'import json, sys; payload=json.load(open(sys.argv[1], encoding="utf-8")); tracker_identity=sys.argv[2]; url=payload.get("html_url"); number=payload.get("number"); sys.exit("GitHub create-ticket API response contained errors or omitted html_url/number") if "errors" in payload or not isinstance(url, str) or not url or not isinstance(number, int) else print(json.dumps({"forge_tag":"github","url":url,"number":number,"tracker_identity":tracker_identity,"work_unit_identity":f"{tracker_identity}#{number}"}, separators=(",", ":")))' "$response" "$tracker_identity"'''
examples = [
  '''gh api repos/tesserine/groundwork/issues --method POST -f title='Add work unit' -F body=@/tmp/work-unit.md''',
]

[[parameters]]
name = "repository"
purpose = "GitHub repository in OWNER/REPO form."
required = true
deployment_value = "repository"

[[parameters]]
name = "tracker_identity"
purpose = "Canonical forge-address tracker identity."
required = true
deployment_value = "tracker_identity"

[[parameters]]
name = "title"
purpose = "Issue title for the tracker-backed work-unit ticket."
required = true

[[parameters]]
name = "body_file"
purpose = "Path to a file containing the issue body."
required = true

[outcome]
description = "A GitHub issue exists in the active repository and stdout contains a canonical work-unit handle."
